name: build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y acpica-tools cpio
      - run: make
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" acpi_override.cpio SSDT-*.aml
        env:
          GH_TOKEN: ${{ github.token }}
